---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "pritunl.fullname" . }}
  labels:
{{ include "pritunl.labels" . | indent 4 }}
{{- with .Values.service.annotations }}
  annotations:
{{ tpl (toYaml .) $ | indent 4 }}
{{- end }}
spec:
  type: {{ .Values.service.type }}
  {{- if eq .Values.service.type "LoadBalancer" }}
  {{- with .Values.service.loadBalancerIP }}
  loadBalancerIP: {{ . }}
  {{- end }}
  {{- with .Values.service.loadBalancerSourceRanges }}
  loadBalancerSourceRanges:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- end }}
  {{- include "pritunl.validatePorts" . }}
  ports:
    {{- range fromYamlArray (include "pritunl.vpnPorts" .) }}
    - name: {{ .name }}
      port: {{ .port }}
      targetPort: {{ .name }}
      {{- if and (eq .name "openvpn") $.Values.service.nodePort }}
      nodePort: {{ $.Values.service.nodePort }}
      {{- end }}
      protocol: {{ .protocol }}
    {{- end }}
    {{- if .Values.service.web.enabled }}
    - name: https
      port: {{ .Values.service.web.port }}
      targetPort: https
      protocol: TCP
    {{- end }}
  selector:
    app: {{ include "pritunl.name" . }}
    release: {{ .Release.Name }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "pritunl.fullname" . }}-web
  labels:
{{ include "pritunl.labels" . | indent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: https
      port: 443
      targetPort: https
  selector:
    app: {{ include "pritunl.name" . }}
    release: {{ .Release.Name }}
