# Mises a jour de versions. Les correctifs de securite (CVE) sont actives
# separement dans les reglages du depot (Dependabot security updates).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: helm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Image figee (bitnamilegacy) pinnee dans values.yaml : Dependabot ne peut
      # pas interroger ce depot Docker Hub et fait echouer tout le job helm.
      - dependency-name: "docker.io/bitnamilegacy/mongodb"
