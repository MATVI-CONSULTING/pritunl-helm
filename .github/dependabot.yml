# Mises a jour de versions. Les correctifs de securite (CVE) sont actives
# separement dans les reglages du depot (Dependabot security updates).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: helm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Changer de version majeure OU mineure de MongoDB (8.0 -> 8.2...) exige la
      # procédure featureCompatibilityVersion (voir README) : on la fait à la
      # main. Dependabot ne propose que les correctifs 8.0.x.
      - dependency-name: "mongo"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
