# Mises a jour de versions. Les correctifs de securite (CVE) sont actives
# separement dans les reglages du depot (Dependabot security updates).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: helm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Une version majeure de MongoDB exige de monter la featureCompatibilityVersion
      # avant/après l'upgrade (voir README) : on la fait à la main.
      - dependency-name: "mongo"
        update-types: ["version-update:semver-major"]
