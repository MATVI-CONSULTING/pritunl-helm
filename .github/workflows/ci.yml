name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-template:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.16.2

      - name: Helm lint
        run: helm lint .

      - name: Helm template (toutes les variantes)
        run: |
          set -euo pipefail
          mkdir -p rendered
          for f in examples/*.yaml; do
            helm template pritunl . -f "$f" > "rendered/$(basename "$f")"
          done
          # Rendu par défaut, et Ingress activé (désactivé partout ailleurs).
          helm template pritunl . > rendered/default.yaml
          helm template pritunl . --set ingress.enabled=true \
            --set ingress.hostname=vpn.example.com > rendered/ingress.yaml

      - name: Install kubeconform
        env:
          KUBECONFORM_VERSION: v0.8.0
          KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
        run: |
          set -euo pipefail
          curl -sSLo kubeconform.tar.gz \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  kubeconform.tar.gz" | sha256sum -c -
          tar xzf kubeconform.tar.gz -C "$RUNNER_TEMP" kubeconform
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Valider les manifestes (kubeconform)
        # Version minimale supportée par le chart (voir README, Prérequis).
        run: kubeconform -strict -summary -kubernetes-version 1.26.0 rendered/*.yaml

      - name: Vérifier l'absence de secret en clair
        run: |
          set -euo pipefail
          if grep -RniE '(password|rootPassword)\s*[:=]\s*[^"'"'"' ].+' values.yaml examples/ \
             | grep -viE 'PRITUNL_MONGODB_PASSWORD|passwordSecret|SecretKey|SecretName|mongodb-passwords'; then
            echo "Secret potentiel en clair détecté" >&2
            exit 1
          fi
